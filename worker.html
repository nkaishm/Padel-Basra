<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة العمال | PADEL COURT</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-primary: #0B1120;
      --bg-secondary: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --neon-blue: #00D4FF;
      --neon-blue-dim: rgba(0, 212, 255, 0.1);
      --emerald: #10B981;
      --emerald-dim: rgba(16, 185, 129, 0.1);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --danger: #EF4444;
      --warning: #F59E0B;
      --border: rgba(148, 163, 184, 0.1);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 900; }
    .logo span { font-size: 1.8rem; }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: var(--bg-secondary);
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--neon-blue), #0099CC);
      color: var(--bg-primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--neon-blue);
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary { background: linear-gradient(135deg, var(--neon-blue), #0099CC); color: var(--bg-primary); }
    .btn-success { background: linear-gradient(135deg, var(--emerald), #059669); color: white; }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #DC2626); color: white; }
    .btn-whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); color: white; }
    .btn-full { width: 100%; }
    .btn-small { padding: 8px 16px; font-size: 0.875rem; }

    /* ===== BOOKING GRID (like index.html) ===== */
    .booking-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .time-slot {
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .time-slot:hover {
      border-color: var(--neon-blue);
      transform: translateY(-2px);
    }

    .time-slot.selected {
      border-color: var(--neon-blue);
      background: var(--neon-blue-dim);
    }

    .time-slot.booked {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .time-slot.booked::after {
      content: "محجوز";
      position: absolute;
      top: 5px;
      left: 5px;
      background: var(--danger);
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .slot-time {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--neon-blue);
      margin-bottom: 0.3rem;
    }

    .slot-period {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .slot-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--emerald);
    }

    .slot-status {
      font-size: 0.75rem;
      margin-top: 0.5rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .slot-status.available {
      background: var(--emerald-dim);
      color: var(--emerald);
    }

    .slot-status.booked {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    /* ===== DATE PICKER SIMPLE ===== */
    .date-picker-simple {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .date-picker-simple select {
      flex: 1;
      padding: 12px;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1rem;
    }

    .date-picker-simple select:focus {
      outline: none;
      border-color: var(--neon-blue);
    }

    /* ===== COURT SELECTOR ===== */
    .court-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .court-option {
      flex: 1;
      padding: 1rem;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .court-option:hover {
      border-color: var(--neon-blue);
    }

    .court-option.active {
      border-color: var(--neon-blue);
      background: var(--neon-blue-dim);
    }

    .court-option h4 {
      color: var(--neon-blue);
      margin-bottom: 0.3rem;
    }

    .court-option p {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .booking-item {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .booking-info { flex: 1; }
    .booking-info h4 { margin-bottom: 0.3rem; }
    .booking-info p { color: var(--text-secondary); font-size: 0.9rem; }

    .booking-actions { display: flex; gap: 0.5rem; }

    .check-in-item {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .check-in-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .check-in-time {
      color: var(--neon-blue);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid #25D366;
      border-radius: 8px;
      color: #25D366;
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .whatsapp-btn:hover {
      background: #25D366;
      color: white;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 700;
      z-index: 3000;
      opacity: 0;
      transition: all 0.4s;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: var(--emerald-dim); border: 1px solid var(--emerald); color: var(--emerald); }
    .toast.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

    .selected-time-display {
      text-align: center;
      padding: 1rem;
      background: var(--neon-blue-dim);
      border: 2px solid var(--neon-blue);
      border-radius: 12px;
      margin-bottom: 1rem;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--neon-blue);
    }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .booking-item { flex-direction: column; align-items: flex-start; }
      .booking-grid { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .time-slot { padding: 0.7rem; }
      .slot-time { font-size: 1rem; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="toast" id="toast"></div>

  <header class="header">
    <div class="logo"><span>🎾</span> PADEL COURT - بوابة العمال</div>
    <div style="display: flex; gap: 0.5rem;">
      <a href="index.html" class="btn btn-secondary" style="text-decoration: none; background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border);">
        <i class="fas fa-arrow-right"></i> العودة
      </a>
      <button class="btn btn-danger" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> خروج
      </button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('bookings')">📅 الحجوزات</button>
      <button class="tab-btn" onclick="showTab('check-in')">✅ تسجيل الوصول</button>
      <button class="tab-btn" onclick="showTab('loyalty')">🎫 الولاء</button>
    </div>

    <!-- تبويب الحجوزات -->
    <div id="bookings-tab" class="tab-content active">
      <div class="card">
        <div class="card-title">⚡ حجز سريع</div>

        <!-- اختيار الملعب -->
        <div class="form-group">
          <label>اختر الملعب</label>
          <div class="court-selector">
            <div class="court-option active" data-court="1" onclick="selectCourt(1)">
              <h4>🎾 ملعب 1</h4>
              <p>اختر للحجز</p>
            </div>
            <div class="court-option" data-court="2" onclick="selectCourt(2)">
              <h4>🎾 ملعب 2</h4>
              <p>اختر للحجز</p>
            </div>
          </div>
          <input type="hidden" id="quick-court" value="1">
        </div>

        <!-- اختيار التاريخ -->
        <div class="form-group">
          <label>التاريخ</label>
          <div class="date-picker-simple">
            <select id="date-day"></select>
            <select id="date-month"></select>
            <select id="date-year"></select>
          </div>
          <input type="hidden" id="quick-date" value="">
        </div>

        <!-- عرض الوقت المختار -->
        <div class="selected-time-display" id="selected-time-display" style="display: none;">
          ⏰ لم يتم اختيار وقت
        </div>

        <!-- شبكة الأوقات -->
        <div class="form-group">
          <label>اختر الوقت المتاح</label>
          <div class="booking-grid" id="time-grid"></div>
          <input type="hidden" id="quick-time" value="">
          <input type="hidden" id="quick-duration" value="1">
        </div>

        <!-- بيانات الزبون -->
        <div class="form-row">
          <div class="form-group">
            <label>اسم الزبون</label>
            <input type="text" id="quick-name" class="form-input" placeholder="محمد أحمد">
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="quick-phone" class="form-input" placeholder="0770 XXX XXXX">
          </div>
        </div>
        <button class="btn btn-primary btn-full" onclick="quickBook()">
          <i class="fas fa-plus"></i> إنشاء حجز
        </button>
      </div>

      <div class="card">
        <div class="card-title">📋 حجوزات اليوم</div>
        <div id="today-bookings-list"></div>
      </div>
    </div>

    <!-- تبويب تسجيل الوصول -->
    <div id="check-in-tab" class="tab-content">
      <div class="card">
        <div class="card-title">✅ تسجيل وصول الزبائن</div>
        <div id="check-in-list"></div>
      </div>
    </div>

    <!-- تبويب الولاء -->
    <div id="loyalty-tab" class="tab-content">
      <div class="card">
        <div class="card-title">🎫 فحص وختم بطاقة الولاء</div>
        <div class="form-group">
          <label>رقم البطاقة</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="check-card" class="form-input" placeholder="PADEL-XXX">
            <button class="btn btn-primary" onclick="checkAndStamp()">
              <i class="fas fa-search"></i> فحص
            </button>
          </div>
        </div>
        <div id="loyalty-result"></div>
      </div>
    </div>
  </div>

  <script>
    // حماية الصفحة - فقط الموظفين
    if (!initAuthProtection('worker')) {
      throw new Error('Unauthorized access');
    }

    const SUPABASE_URL = 'https://hrfentlnqxquhlaywlzv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZmVudGxucXhxdWhsYXl3bHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjY4NDMsImV4cCI6MjA5NTE0Mjg0M30.mseVeL5hqNXs5U-Vj_OddqCWzt-6lEm0E4Dftk08EfY';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Time slots configuration (same as index.html)
    const TIME_SLOTS = [
      { hour: 9,  period: 'صباحاً', icon: '🌅', price: 25000 },
      { hour: 10, period: 'صباحاً', icon: '🌅', price: 25000 },
      { hour: 11, period: 'صباحاً', icon: '🌅', price: 25000 },
      { hour: 12, period: 'ظهراً',  icon: '☀️', price: 25000 },
      { hour: 13, period: 'ظهراً',  icon: '☀️', price: 25000 },
      { hour: 14, period: 'عصراً',  icon: '🌤️', price: 40000 },
      { hour: 15, period: 'عصراً',  icon: '🌤️', price: 40000 },
      { hour: 16, period: 'عصراً',  icon: '🌤️', price: 40000 },
      { hour: 17, period: 'مساءً',  icon: '🌇', price: 40000 },
      { hour: 18, period: 'مساءً',  icon: '🌇', price: 40000 },
      { hour: 19, period: 'مساءً',  icon: '🌇', price: 40000 },
      { hour: 20, period: 'ليلاً',  icon: '🌙', price: 50000 },
      { hour: 21, period: 'ليلاً',  icon: '🌙', price: 50000 },
      { hour: 22, period: 'ليلاً',  icon: '🌙', price: 50000 },
      { hour: 23, period: 'ليلاً',  icon: '🌙', price: 50000 },
      { hour: 0,  period: 'بعد منتصف الليل', icon: '🌙', price: 50000 },
      { hour: 1,  period: 'بعد منتصف الليل', icon: '🌙', price: 50000 },
    ];

    let selectedCourt = 1;
    let selectedDate = '';
    let selectedTimeSlot = null;
    let bookedSlots = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await setSupabaseUser(supabaseClient);
      initDatePicker();
      await loadTimeGrid();
      await loadDashboard();
    });

    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      requestAnimationFrame(function() { toast.classList.add('show'); });
      setTimeout(function() { toast.classList.remove('show'); }, 4000);
    }

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById(tabId + '-tab').classList.add('active');
      event.target.classList.add('active');
      if (tabId === 'bookings') loadTodayBookings();
      if (tabId === 'check-in') loadCheckInList();
    }

    // ===== DATE PICKER =====
    function initDatePicker() {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonth = today.getMonth() + 1;
      const currentDay = today.getDate();

      const monthNames = ['يناير','فبراير','مارس','ابريل','مايو','يونيو','يوليو','اغسطس','سبتمبر','اكتوبر','نوفمبر','ديسمبر'];

      // Days
      const daySelect = document.getElementById('date-day');
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if (i === currentDay) opt.selected = true;
        daySelect.appendChild(opt);
      }

      // Months
      const monthSelect = document.getElementById('date-month');
      for (let i = 1; i <= 12; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = monthNames[i-1];
        if (i === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }

      // Years
      const yearSelect = document.getElementById('date-year');
      for (let i = currentYear - 1; i <= currentYear + 2; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if (i === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      updateDateValue();

      daySelect.addEventListener('change', updateDateValue);
      monthSelect.addEventListener('change', updateDateValue);
      yearSelect.addEventListener('change', updateDateValue);
    }

    function updateDateValue() {
      const day = document.getElementById('date-day').value;
      const month = document.getElementById('date-month').value;
      const year = document.getElementById('date-year').value;
      selectedDate = year + '-' + month.padStart(2, '0') + '-' + day.padStart(2, '0');
      document.getElementById('quick-date').value = selectedDate;
      loadTimeGrid();
    }

    // ===== COURT SELECTOR =====
    function selectCourt(court) {
      selectedCourt = court;
      document.getElementById('quick-court').value = court;
      document.querySelectorAll('.court-option').forEach(function(el) {
        el.classList.remove('active');
      });
      document.querySelector('.court-option[data-court="' + court + '"]').classList.add('active');
      loadTimeGrid();
    }

    // ===== TIME GRID =====
    async function loadTimeGrid() {
      const grid = document.getElementById('time-grid');
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">جاري التحميل...</p>';

      // Get bookings for selected date and court
      const { data: bookings, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('booking_date', selectedDate)
        .eq('court_id', selectedCourt)
        .not('status', 'eq', 'cancelled');

      if (error) {
        showToast('خطأ في تحميل الأوقات', 'error');
        return;
      }

      bookedSlots = bookings || [];
      renderTimeGrid();
    }

    function renderTimeGrid() {
      const grid = document.getElementById('time-grid');
      grid.innerHTML = '';

      TIME_SLOTS.forEach(function(slot) {
        const hourStr = slot.hour.toString().padStart(2, '0') + ':00';
        const isBooked = bookedSlots.some(function(b) {
          return b.start_time.substring(0, 2) === slot.hour.toString().padStart(2, '0');
        });

        const div = document.createElement('div');
        div.className = 'time-slot' + (isBooked ? ' booked' : '');
        if (!isBooked) {
          div.onclick = function() { selectTimeSlot(slot); };
        }

        div.innerHTML = 
          '<div class="slot-time">' + hourStr + '</div>' +
          '<div class="slot-period">' + slot.icon + ' ' + slot.period + '</div>' +
          '<div class="slot-price">' + slot.price.toLocaleString() + ' د.ع</div>' +
          '<div class="slot-status ' + (isBooked ? 'booked' : 'available') + '">' +
          (isBooked ? '❌ محجوز' : '✅ متاح') +
          '</div>';

        grid.appendChild(div);
      });
    }

    function selectTimeSlot(slot) {
      selectedTimeSlot = slot;
      const hourStr = slot.hour.toString().padStart(2, '0') + ':00';
      document.getElementById('quick-time').value = hourStr;
      document.getElementById('quick-duration').value = '1';

      document.getElementById('selected-time-display').style.display = 'block';
      document.getElementById('selected-time-display').innerHTML = 
        '🎾 ملعب ' + selectedCourt + ' | 📅 ' + selectedDate + ' | ⏰ ' + hourStr + 
        '<br>💰 ' + slot.price.toLocaleString() + ' د.ع';

      // Update visual selection
      document.querySelectorAll('.time-slot').forEach(function(el) {
        el.classList.remove('selected');
      });
      event.currentTarget.classList.add('selected');
    }

    // ===== QUICK BOOK =====
    async function quickBook() {
      const courtId = selectedCourt;
      const date = document.getElementById('quick-date').value;
      const time = document.getElementById('quick-time').value;
      const name = document.getElementById('quick-name').value.trim();
      const phone = document.getElementById('quick-phone').value.trim();

      if (!name || !phone || !date || !time) {
        showToast('الرجاء ملء جميع الحقول واختيار وقت', 'error');
        return;
      }

      const startHour = parseInt(time.split(':')[0]);
      const endHour = (startHour + 1) % 24;
      const endTime = endHour.toString().padStart(2, '0') + ':00';
      const price = selectedTimeSlot ? selectedTimeSlot.price : 40000;

      const { error } = await supabaseClient.from('bookings').insert([{
        court_id: courtId,
        customer_name: name,
        phone: phone,
        booking_date: date,
        start_time: time,
        end_time: endTime,
        duration_hours: 1,
        price: price,
        final_price: price,
        status: 'confirmed',
        created_by: 'worker'
      }]);

      if (error) {
        showToast('حدث خطأ: ' + error.message, 'error');
      } else {
        showToast('تم إنشاء الحجز بنجاح', 'success');
        document.getElementById('quick-name').value = '';
        document.getElementById('quick-phone').value = '';
        document.getElementById('quick-time').value = '';
        document.getElementById('selected-time-display').style.display = 'none';
        document.querySelectorAll('.time-slot').forEach(function(el) {
          el.classList.remove('selected');
        });
        selectedTimeSlot = null;
        loadTimeGrid();
        loadTodayBookings();
      }
    }

    // ===== TODAY BOOKINGS =====
    async function loadTodayBookings() {
      const today = new Date().toISOString().split('T')[0];
      const { data: bookings, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('booking_date', today)
        .not('status', 'eq', 'cancelled')
        .order('start_time', { ascending: true });

      const container = document.getElementById('today-bookings-list');
      if (error || !bookings || bookings.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 1rem;">لا توجد حجوزات اليوم</p>';
        return;
      }

      container.innerHTML = bookings.map(function(b) {
        return '<div class="booking-item">' +
          '<div class="booking-info">' +
            '<h4>' + b.customer_name + '</h4>' +
            '<p>📞 ' + b.phone + ' | 🎾 ملعب ' + b.court_id + ' | ⏰ ' + b.start_time.substring(0, 5) + ' - ' + b.end_time.substring(0, 5) + '</p>' +
          '</div>' +
          '<div class="booking-actions">' +
            '<button class="btn btn-success btn-small" onclick="completeBooking(' + "'" + b.id + "'" + ')">' +
              '<i class="fas fa-check"></i> تم' +
            '</button>' +
            '<button class="btn btn-danger btn-small" onclick="cancelBooking(' + "'" + b.id + "'" + ')">' +
              '<i class="fas fa-times"></i> إلغاء' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    async function completeBooking(id) {
      await supabaseClient.from('bookings').update({ status: 'completed' }).eq('id', id);
      loadTodayBookings();
      showToast('تم تسجيل الوصول', 'success');
    }

    async function cancelBooking(id) {
      if (!confirm('هل أنت متأكد؟')) return;
      await supabaseClient.from('bookings').update({ status: 'cancelled' }).eq('id', id);
      loadTodayBookings();
      showToast('تم إلغاء الحجز', 'success');
    }

    // ===== CHECK IN =====
    async function loadCheckInList() {
      const today = new Date().toISOString().split('T')[0];
      const now = new Date();
      const currentHour = now.getHours();

      const { data: bookings, error } = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('booking_date', today)
        .eq('status', 'confirmed')
        .order('start_time', { ascending: true });

      const container = document.getElementById('check-in-list');
      if (error || !bookings || bookings.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 1rem;">لا توجد حجوزات للتسجيل</p>';
        return;
      }

      container.innerHTML = bookings.map(function(b) {
        const bookingHour = parseInt(b.start_time.split(':')[0]);
        const isNow = bookingHour === currentHour;
        const isUpcoming = bookingHour > currentHour;

        let statusBadge = '';
        if (isNow) statusBadge = '<span style="color: var(--emerald); font-weight: 700;">🟢 الآن</span>';
        else if (isUpcoming) statusBadge = '<span style="color: var(--neon-blue);">🔜 قادم</span>';
        else statusBadge = '<span style="color: var(--text-muted);">⏰ انتهى</span>';

        const cleanPhone = b.phone.replace(/\D/g, '');
        const msg = encodeURIComponent('مرحباً ' + b.customer_name + '،\n\nتذكير بحجزك في ملعب بادل 🎾\n📅 اليوم الساعة ' + b.start_time.substring(0, 5) + '\n\nنتمنى لك وقت ممتع! 😊');

        return '<div class="check-in-item">' +
          '<div class="check-in-header">' +
            '<div>' +
              '<span class="check-in-time">' + b.start_time.substring(0, 5) + '</span>' +
              statusBadge +
            '</div>' +
            '<span style="color: var(--text-muted);">ملعب ' + b.court_id + '</span>' +
          '</div>' +
          '<div style="margin-bottom: 0.8rem;">' +
            '<strong>' + b.customer_name + '</strong> | 📞 ' + b.phone +
          '</div>' +
          '<div style="display: flex; gap: 0.5rem;">' +
            '<a href="https://wa.me/964' + cleanPhone + '?text=' + msg + '" target="_blank" class="whatsapp-btn">' +
              '<i class="fab fa-whatsapp"></i> إرسال تذكير' +
            '</a>' +
            '<button class="btn btn-success btn-small" onclick="completeBooking(' + "'" + b.id + "'" + ')">' +
              '<i class="fas fa-check"></i> تسجيل وصول' +
            '</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    // ===== LOYALTY =====
    async function checkAndStamp() {
      const cardNumber = document.getElementById('check-card').value.trim();
      const resultDiv = document.getElementById('loyalty-result');

      if (!cardNumber) {
        resultDiv.innerHTML = '';
        return;
      }

      const { data, error } = await supabaseClient
        .from('loyalty_cards')
        .select('*')
        .eq('card_number', cardNumber)
        .single();

      if (error || !data) {
        resultDiv.innerHTML = '<div style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 1rem; border-radius: 10px; margin-top: 1rem;">❌ رقم البطاقة غير موجود</div>';
        return;
      }

      const remaining = 10 - data.stamps;
      let stampsHtml = '';
      for (let i = 0; i < 10; i++) {
        stampsHtml += '<div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid ' + 
          (i < data.stamps ? 'var(--emerald)' : 'var(--border)') + '; background: ' + 
          (i < data.stamps ? 'var(--emerald)' : 'transparent') + '; color: ' + 
          (i < data.stamps ? 'white' : 'var(--text-muted)') + '; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700;">' +
          (i < data.stamps ? '✓' : (i + 1)) + '</div>';
      }

      resultDiv.innerHTML = '<div style="background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-top: 1rem;">' +
        '<h4 style="margin-bottom: 1rem; color: var(--neon-blue);">' + data.customer_name + '</h4>' +
        '<p style="color: var(--text-secondary); margin-bottom: 1rem;">📞 ' + data.phone + '</p>' +
        '<div style="display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap;">' + stampsHtml + '</div>' +
        '<p style="margin-bottom: 1rem;">' +
          (data.stamps >= 10 ? '🎉 <strong style="color: var(--emerald);">مبروك! البطاقة مكتملة - خصم 10%</strong>' : 'متبقي <strong>' + remaining + '</strong> ختمات للخصم') +
        '</p>' +
        (data.stamps < 10 ? '<button class="btn btn-primary btn-full" onclick="addStamp(' + "'" + data.card_number + "'" + ')"><i class="fas fa-plus"></i> إضافة ختم</button>' : '') +
      '</div>';
    }

    async function addStamp(cardNumber) {
      await supabaseClient.rpc('increment_loyalty_stamp', { card_num: cardNumber });
      checkAndStamp();
      showToast('تم إضافة الختم', 'success');
    }

    async function loadDashboard() {
      await loadTodayBookings();
    }
  </script>
</body>
</html>
