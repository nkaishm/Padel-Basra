<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | PADEL COURT</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0B1120;
      --bg-secondary: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --neon-blue: #00D4FF;
      --neon-blue-dim: rgba(0, 212, 255, 0.1);
      --neon-blue-glow: rgba(0, 212, 255, 0.3);
      --emerald: #10B981;
      --emerald-dim: rgba(16, 185, 129, 0.1);
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --danger: #EF4444;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border: rgba(148, 163, 184, 0.1);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .login-logo {
      font-size: 4rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--neon-blue), var(--emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    /* ===== اختيار الدور ===== */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .role-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      padding: 2rem 1rem;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .role-btn i {
      font-size: 2rem;
    }

    .role-btn:hover {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      background: var(--neon-blue-dim);
      transform: translateY(-3px);
    }

    .role-btn.active {
      border-color: var(--neon-blue);
      background: var(--neon-blue-dim);
      color: var(--neon-blue);
      box-shadow: 0 0 20px var(--neon-blue-glow);
    }

    .role-btn.manager.active {
      border-color: var(--emerald);
      background: var(--emerald-dim);
      color: var(--emerald);
      box-shadow: 0 0 20px var(--emerald-glow);
    }

    /* ===== نموذج تسجيل الدخول ===== */
    .login-form {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .login-form.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .form-header i {
      font-size: 1.2rem;
    }

    .form-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1.2rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 2px;
      transition: var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 0 4px var(--neon-blue-dim);
    }

    .pin-input {
      font-size: 1.5rem;
      letter-spacing: 8px;
      font-weight: 700;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--neon-blue), #0099CC);
      border: none;
      border-radius: 12px;
      color: var(--bg-primary);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login.manager-btn {
      background: linear-gradient(135deg, var(--emerald), #059669);
    }

    .btn-login.manager-btn:hover {
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.3);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: var(--transition);
    }

    .back-btn:hover {
      color: var(--neon-blue);
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }

    .error-msg.show { display: block; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .back-link:hover { color: var(--neon-blue); }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 700;
      z-index: 3000;
      opacity: 0;
      transition: all 0.4s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    @media (max-width: 480px) {
      .login-container { padding: 2rem 1.5rem; }
      .login-title { font-size: 1.5rem; }
      .role-selector { gap: 0.8rem; }
      .role-btn { padding: 1.5rem 0.8rem; }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="login-container">
    <div class="login-logo">🎾</div>
    <h1 class="login-title">PADEL COURT</h1>
    <p class="login-subtitle">تسجيل الدخول للموظفين</p>

    <div class="error-msg" id="error-msg"></div>

    <!-- اختيار الدور -->
    <div id="role-selection">
      <div class="role-selector">
        <button class="role-btn manager" onclick="selectRole('manager')">
          <i class="fas fa-user-shield"></i>
          <span>مدير</span>
        </button>
        <button class="role-btn worker" onclick="selectRole('worker')">
          <i class="fas fa-user"></i>
          <span>موظف</span>
        </button>
      </div>
    </div>

    <!-- نموذج المدير -->
    <div id="manager-form" class="login-form">
      <div class="form-header">
        <i class="fas fa-user-shield" style="color: var(--emerald);"></i>
        <h3 style="color: var(--emerald);">تسجيل دخول المدير</h3>
      </div>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="manager-username" class="form-input" placeholder="admin" autocomplete="off">
      </div>
      <div class="form-group">
        <label>رمز PIN (6 أرقام)</label>
        <input type="password" id="manager-pin" class="form-input pin-input" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn-login manager-btn" id="manager-btn" onclick="login('manager')">
        <i class="fas fa-lock"></i> تسجيل الدخول
      </button>
      <button class="back-btn" onclick="backToSelection()">
        <i class="fas fa-arrow-right"></i> رجوع
      </button>
    </div>

    <!-- نموذج الموظف -->
    <div id="worker-form" class="login-form">
      <div class="form-header">
        <i class="fas fa-user" style="color: var(--neon-blue);"></i>
        <h3 style="color: var(--neon-blue);">تسجيل دخول الموظف</h3>
      </div>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="worker-username" class="form-input" placeholder="worker1" autocomplete="off">
      </div>
      <div class="form-group">
        <label>رمز PIN (6 أرقام)</label>
        <input type="password" id="worker-pin" class="form-input pin-input" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <button class="btn-login" id="worker-btn" onclick="login('worker')">
        <i class="fas fa-lock"></i> تسجيل الدخول
      </button>
      <button class="back-btn" onclick="backToSelection()">
        <i class="fas fa-arrow-right"></i> رجوع
      </button>
    </div>

    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-right"></i>
      العودة للموقع
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    const SUPABASE_URL = 'https://hrfentlnqxquhlaywlzv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZmVudGxucXhxdWhsYXl3bHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjY4NDMsImV4cCI6MjA5NTE0Mjg0M30.mseVeL5hqNXs5U-Vj_OddqCWzt-6lEm0E4Dftk08EfY';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRole = null;

    // إذا كان مسجلاً مسبقاً، وجه حسب الدور
    const existingSession = getSession();
    if (existingSession) {
      if (existingSession.role === 'manager') {
        window.location.href = 'admin.html';
      } else if (existingSession.role === 'worker') {
        window.location.href = 'worker.html';
      }
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('role-selection').style.display = 'none';

      if (role === 'manager') {
        document.getElementById('manager-form').classList.add('active');
      } else {
        document.getElementById('worker-form').classList.add('active');
      }
    }

    function backToSelection() {
      selectedRole = null;
      document.getElementById('role-selection').style.display = 'block';
      document.getElementById('manager-form').classList.remove('active');
      document.getElementById('worker-form').classList.remove('active');
    }

    async function login(expectedRole) {
      const usernameInput = expectedRole === 'manager' ? 'manager-username' : 'worker-username';
      const pinInput = expectedRole === 'manager' ? 'manager-pin' : 'worker-pin';
      const btnId = expectedRole === 'manager' ? 'manager-btn' : 'worker-btn';

      const username = document.getElementById(usernameInput).value.trim().toLowerCase();
      const pin = document.getElementById(pinInput).value.trim();
      const errorMsg = document.getElementById('error-msg');
      const btn = document.getElementById(btnId);

      // التحقق من المحاولات
      const attemptCheck = checkLoginAttempts();
      if (!attemptCheck.allowed) {
        errorMsg.textContent = attemptCheck.message;
        errorMsg.classList.add('show');
        return;
      }

      if (!username || pin.length !== 6) {
        errorMsg.textContent = 'الرجاء إدخال اسم المستخدم وPIN مكون من 6 أرقام';
        errorMsg.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

      try {
        const { data, error } = await supabaseClient
          .rpc('verify_pin', { p_username: username, p_pin: pin });

        if (error) throw error;

        if (!data || !data[0] || !data[0].valid) {
          recordFailedAttempt();
          throw new Error('اسم المستخدم أو PIN غير صحيح');
        }

        const userData = data[0];

        if (!userData.is_active) {
          throw new Error('الحساب معطل. تواصل مع المدير');
        }

        // ✅ التحقق من تطابق الدور
        if (userData.role !== expectedRole) {
          throw new Error('هذا الحساب ليس ' + (expectedRole === 'manager' ? 'مدير' : 'موظف'));
        }

        // إنشاء الجلسة
        const session = {
          username: username,
          role: userData.role,
          loginTime: Date.now(),
          expiresAt: Date.now() + AUTH_CONFIG.SESSION_TIMEOUT
        };

        saveSession(session);

        // إرسال اسم المستخدم لـ Supabase RLS
        await setSupabaseUser(supabaseClient);

        // ✅ التوجيه المباشر حسب الدور المختار
        const targetPage = expectedRole === 'manager' ? 'admin.html' : 'worker.html';
        window.location.href = targetPage;

      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = err.message || 'حدث خطأ في تسجيل الدخول';
        errorMsg.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-lock"></i> تسجيل الدخول';
      }
    }

    // Enter للتسجيل
    document.getElementById('manager-pin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login('manager');
    });
    document.getElementById('worker-pin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login('worker');
    });

    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>
