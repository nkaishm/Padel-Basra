<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | PADEL COURT</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0B1120;
      --bg-secondary: #0f172a;
      --bg-card: #1e293b;
      --neon-blue: #00D4FF;
      --neon-blue-dim: rgba(0, 212, 255, 0.1);
      --emerald: #10B981;
      --danger: #EF4444;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --border: rgba(148, 163, 184, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-logo {
      font-size: 4rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--neon-blue), var(--emerald));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-primary);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 2px;
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 0 4px var(--neon-blue-dim);
    }

    .pin-input {
      font-size: 1.5rem;
      letter-spacing: 8px;
      font-weight: 700;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--neon-blue), #0099CC);
      border: none;
      border-radius: 12px;
      color: var(--bg-primary);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      display: none;
      font-size: 0.9rem;
    }

    .error-msg.show { display: block; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .back-link:hover { color: var(--neon-blue); }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 700;
      z-index: 3000;
      opacity: 0;
      transition: all 0.4s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    @media (max-width: 480px) {
      .login-container { padding: 2rem 1.5rem; }
      .login-title { font-size: 1.5rem; }
    }
  </style>
<base target="_blank">
<base target="_blank">
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="login-container">
    <div class="login-logo">🎾</div>
    <h1 class="login-title">PADEL COURT</h1>
    <p class="login-subtitle">تسجيل الدخول للموظفين</p>

    <div class="error-msg" id="error-msg"></div>

    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" class="form-input" placeholder="admin أو worker1" autocomplete="off">
    </div>

    <div class="form-group">
      <label>رمز PIN (6 أرقام)</label>
      <input type="password" id="pin" class="form-input pin-input" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="off">
    </div>

    <button class="btn-login" id="login-btn" onclick="login()">
      <i class="fas fa-lock"></i> تسجيل الدخول
    </button>

    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-right"></i>
      العودة للموقع
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>
    const SUPABASE_URL = 'https://hrfentlnqxquhlaywlzv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZmVudGxucXhxdWhsYXl3bHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjY4NDMsImV4cCI6MjA5NTE0Mjg0M30.mseVeL5hqNXs5U-Vj_OddqCWzt-6lEm0E4Dftk08EfY';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    // إذا كان مسجلاً مسبقاً، أعد التوجيه
    if (getSession()) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'admin.html';
        window.location.href = redirect;
    }

    async function login() {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const pin = document.getElementById('pin').value.trim();
        const errorMsg = document.getElementById('error-msg');
        const btn = document.getElementById('login-btn');

        // التحقق من المحاولات
        const attemptCheck = checkLoginAttempts();
        if (!attemptCheck.allowed) {
            errorMsg.textContent = attemptCheck.message;
            errorMsg.classList.add('show');
            return;
        }

        if (!username || pin.length !== 6) {
            errorMsg.textContent = 'الرجاء إدخال اسم المستخدم وPIN مكون من 6 أرقام';
            errorMsg.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

        try {
            const { data, error } = await supabaseClient
                .rpc('verify_pin', { p_username: username, p_pin: pin });

            if (error) throw error;

            if (!data || !data[0] || !data[0].valid) {
                recordFailedAttempt();
                throw new Error('اسم المستخدم أو PIN غير صحيح');
            }

            const userData = data[0];

            // 🔍 تسجيل مفصل للتحقق
            console.log('🔍 Full userData:', JSON.stringify(userData));
            console.log('🔍 userData.role:', userData.role);
            console.log('🔍 userData.role type:', typeof userData.role);
            console.log('🔍 Is role === worker?', userData.role === 'worker');
            console.log('🔍 Is role === manager?', userData.role === 'manager');

            if (!userData.is_active) {
                throw new Error('الحساب معطل. تواصل مع المدير');
            }

            // إنشاء الجلسة
            const session = {
                username: username,
                role: userData.role,
                loginTime: Date.now(),
                expiresAt: Date.now() + AUTH_CONFIG.SESSION_TIMEOUT
            };

            saveSession(session);

            // ✅ إرسال اسم المستخدم لـ Supabase RLS
            await setSupabaseUser(supabaseClient);

            // إعادة التوجيه
            const redirect = new URLSearchParams(window.location.search).get('redirect');
            let targetPage = 'index.html';

            if (redirect) {
                targetPage = redirect;
            } else if (userData.role === 'manager') {
                targetPage = 'admin.html';
            } else if (userData.role === 'worker') {
                targetPage = 'worker.html';
            }

            window.location.href = targetPage;

        } catch (err) {
            console.error('Login error:', err);
            errorMsg.textContent = err.message || 'حدث خطأ في تسجيل الدخول';
            errorMsg.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-lock"></i> تسجيل الدخول';
        }
    }

    // Enter للتسجيل
    document.getElementById('pin').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
    });

    function showToast(message, type = 'error') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type}`;
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>
